# ============================================================
# LLM provider selection
# Change only this value to switch between different LLM APIs.
# Available examples: deepseek, openai, qwen, vectorengine, ollama, wansk
# ============================================================
llm.provider=vectorengine


# ============================================================
# Global generation parameters
# These values are shared by all providers unless overridden later.
# ============================================================
llm.threads=4
llm.temperature=0.2
llm.max.tokens=6000
llm.connect.timeout.millis=30000
llm.read.timeout.millis=120000
llm.api.max.attempts=2
llm.max.input.tokens=20000
llm.max.input.chars=60000
llm.oversize.prompt.policy=truncate
#llm.thinking.type=disabled

# # If regenerating test cases with the large language model, use the following configuration.
# llm.skip.existing.compiled=false
# llm.force.regenerate=true
# Otherwise, if using cached results
llm.skip.existing.compiled=true
llm.force.regenerate=false




# ============================================================
# DeepSeek
# OpenAI-compatible chat completions API
# ============================================================
llm.providers.deepseek.api.url=https://api.deepseek.com/chat/completions
llm.providers.deepseek.model=deepseek-v4-flash
llm.providers.deepseek.api.key=sk-8caf7653e20a46b68e00fa2320bf727e


# ============================================================
# OpenAI
# OpenAI official chat completions API
# ============================================================
llm.providers.openai.api.url=https://api.openai.com/v1/chat/completions
llm.providers.openai.model=gpt-5.4
llm.providers.openai.api.key=PUT_YOUR_OPENAI_KEY_HERE


# ============================================================
# Alibaba Cloud DashScope / Qwen
# OpenAI-compatible mode
