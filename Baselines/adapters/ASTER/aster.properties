# ASTER paper does not disclose numeric stopping bounds.  These values are
# explicit reimplementation safety bounds, not claims about the original tool.
aster.max.repair.rounds=3
# The public artifact stores one initial Test suite and one Coverage_Test suite.
aster.max.coverage.rounds=1
aster.target.focal.line.coverage=1.0
# Paper input is user-specified. Leave empty unless the evaluated project has a
# known mockable third-party API and Mockito on its test classpath.
aster.mockable.api.prefixes=
aster.max.transitive.constructor.depth=2
aster.max.context.types=20
