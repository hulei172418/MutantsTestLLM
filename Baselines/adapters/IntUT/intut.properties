# Paper-backed settings.
intut.candidates.per.intention=5
intut.rag.jaccard.threshold=0.8
intut.rag.max.test.examples=3
intut.rag.max.mock.examples=5

# The paper exposes these controls but does not disclose the experimental
# values. They are explicit reimplementation safety bounds and are copied into
# every run's metadata; they are not claims about the original IntUT plugin.
intut.max.execution.functions=10
intut.max.call.recursion.depth=2
intut.max.intentions=64

